# 모든 Config 클라이언트가 공통으로 받는 설정
# 같은 키가 <서비스 이름>.yaml에도 있으면 서비스 파일의 값이 우선한다
# (서비스 파일의 기본 섹션도 이 파일의 프로필 섹션보다 우선하므로, 서비스마다 다른 프로필 설정은 서비스 파일에 둔다)
spring.reactor.context-propagation: auto
management.tracing.sampling.probability: 1.0
management.opentelemetry.tracing.export.otlp.endpoint: http://localhost:4318/v1/traces
management.otlp.metrics.export.url: http://localhost:4318/v1/metrics
management.opentelemetry.logging.export.otlp.endpoint: http://localhost:4318/v1/logs

app:
  auth-server: localhost

spring.rabbitmq:
  host: 127.0.0.1
  port: 5672
  username: guest
  password: guest

spring.cloud.stream.kafka.binder:
  brokers: 127.0.0.1
  defaultBrokerPort: 9092

# WARNING: Exposing all management endpoints over http should only be used during development, must be locked down in production!
management.endpoint.health.show-details: "ALWAYS"
management.endpoints.web.exposure.include: "*"

---
spring.config.activate.on-profile: docker

app:
  auth-server: auth-server

# 대신 추가
management.opentelemetry.tracing.export.otlp.endpoint: http://grafana-lgtm:4318/v1/traces
management.otlp.metrics.export.url: http://grafana-lgtm:4318/v1/metrics
management.opentelemetry.logging.export.otlp.endpoint: http://grafana-lgtm:4318/v1/logs

spring.rabbitmq.host: rabbitmq

spring.cloud.stream.kafka.binder.brokers: kafka
