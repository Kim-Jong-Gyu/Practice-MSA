server.port: 8443
spring.application.name: gateway

app.config-server: localhost

# OAuth2 리소스 서버: 인가 서버의 공개 키로 JWT 서명을 검증한다
spring.security.oauth2.resourceserver.jwt.issuer-uri: https://dev-5r5apv33hgiui71h.us.auth0.com/

server.ssl:
  key-store-type: PKCS12
  key-store: classpath:keystore/edge.p12
  key-store-password: 89472643
  key-alias: localhost

# 뒤쪽 서비스(특히 auth-server)에 원래 요청 주소(https://localhost:8443)를 X-Forwarded-* 헤더로 알려 준다
# 신뢰할 프록시를 지정하지 않으면 이 헤더를 붙이지 않으므로, 실습에서는 모두 신뢰한다 (운영에서는 실제 프록시 대역만)
spring.cloud.gateway.server.webflux.trusted-proxies: ".*"

# 서비스 디스커버리 없이 서비스 이름을 DNS로 찾는다 (docker compose 네트워크 / 쿠버네티스 Service 이름)
# 포트를 생략하면 http 기본 포트 80으로 간다
spring.cloud.gateway.server.webflux.routes:

  - id: product-composite
    uri: http://product-composite
    predicates:
      - Path=/product-composite/**

  # 인가 서버 (토큰 발급 /oauth2/token, 공개 키 /oauth2/jwks, 로그인 화면, OpenID 설정)
  - id: oauth2-server
    uri: http://${app.auth-server}
    predicates:
      - Path=/oauth2/**

  - id: oauth2-login
    uri: http://${app.auth-server}
    predicates:
      - Path=/login/**

  - id: oauth2-well-known
    uri: http://${app.auth-server}
    predicates:
      - Path=/.well-known/**

  - id: config-server
    uri: http://${app.config-server}:8888
    predicates:
      - Path=/config/**
    filters:
      - RewritePath=/config/(?<segment>.*), /$\{segment}

  - id: host_route_200
    uri: https://httpbin.org
    predicates:
      - Host=i.feel.lucky:8443
      - Path=/headerrouting/**
    filters:
      - SetPath=/status/200

  - id: host_route_418
    uri: https://httpbin.org
    predicates:
      - Host=im.a.teapot:8443
      - Path=/headerrouting/**
    filters:
      - SetPath=/status/418

  - id: host_route_501
    uri: https://httpbin.org
    predicates:
      - Path=/headerrouting/**
    filters:
      - SetPath=/status/501

management.endpoint.gateway.access: unrestricted

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator: INFO
    org.springframework.cloud.gateway: TRACE

---
spring.config.activate.on-profile: docker

app.config-server: config-server
