services:
  product:
    build: microservices/product-service
    mem_limit: 512m
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_USR=${CONFIG_SERVER_USR}
      - CONFIG_SERVER_PWD=${CONFIG_SERVER_PWD}
      # 프로필 적용 전에도 Config Server에 한 번 접속하므로, 주소는 프로필이 아니라 환경변수로 넘긴다
      - APP_CONFIG_SERVER=config-server
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    networks:
      - my-network
  recommendation:
    build: microservices/recommendation-service
    mem_limit: 512m
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_USR=${CONFIG_SERVER_USR}
      - CONFIG_SERVER_PWD=${CONFIG_SERVER_PWD}
      # 프로필 적용 전에도 Config Server에 한 번 접속하므로, 주소는 프로필이 아니라 환경변수로 넘긴다
      - APP_CONFIG_SERVER=config-server
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    networks:
      - my-network
  review:
    build: microservices/review-service
    mem_limit: 512m
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_USR=${CONFIG_SERVER_USR}
      - CONFIG_SERVER_PWD=${CONFIG_SERVER_PWD}
      # 프로필 적용 전에도 Config Server에 한 번 접속하므로, 주소는 프로필이 아니라 환경변수로 넘긴다
      - APP_CONFIG_SERVER=config-server
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    networks:
      - my-network
  product-composite:
    build: microservices/product-composite-service
    mem_limit: 512m
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_USR=${CONFIG_SERVER_USR}
      - CONFIG_SERVER_PWD=${CONFIG_SERVER_PWD}
      # 프로필 적용 전에도 Config Server에 한 번 접속하므로, 주소는 프로필이 아니라 환경변수로 넘긴다
      - APP_CONFIG_SERVER=config-server
    depends_on:
      rabbitmq:
        condition: service_healthy

    networks:
      - my-network
  eureka:
    build: spring-cloud/eureka-server
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_USR=${CONFIG_SERVER_USR}
      - CONFIG_SERVER_PWD=${CONFIG_SERVER_PWD}
      # 프로필 적용 전에도 Config Server에 한 번 접속하므로, 주소는 프로필이 아니라 환경변수로 넘긴다
      - APP_CONFIG_SERVER=config-server
    mem_limit: 512m

    networks:
      - my-network
  gateway:
    build: spring-cloud/gateway
    mem_limit: 512m
    ports:
      - "8443:8443"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_SSL_KEY_STORE=file:/keystore/edge-test.p12
      - SERVER_SSL_KEY_STORE_PASSWORD=${SERVER_SSL_KEY_STORE_PASSWORD}
      - CONFIG_SERVER_USR=${CONFIG_SERVER_USR}
      - CONFIG_SERVER_PWD=${CONFIG_SERVER_PWD}
      # 프로필 적용 전에도 Config Server에 한 번 접속하므로, 주소는 프로필이 아니라 환경변수로 넘긴다
      - APP_CONFIG_SERVER=config-server
    volumes:
      - ./keystore:/keystore:ro

    networks:
      - my-network
  config-server:
    environment:
      - SPRING_PROFILES_ACTIVE=docker,native
      - ENCRYPT_KEY=${CONFIG_SERVER_ENCRYPT_KEY}
      - SPRING_SECURITY_USER_NAME=${CONFIG_SERVER_USR}
      - SPRING_SECURITY_USER_PASSWORD=${CONFIG_SERVER_PWD}
    volumes:
      - ./config-repo:/config-repo:ro
    build: spring-cloud/config-server
    mem_limit: 512m

    networks:
      - my-network
  auth-server:
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_USR=${CONFIG_SERVER_USR}
      - CONFIG_SERVER_PWD=${CONFIG_SERVER_PWD}
      # 프로필 적용 전에도 Config Server에 한 번 접속하므로, 주소는 프로필이 아니라 환경변수로 넘긴다
      - APP_CONFIG_SERVER=config-server
    build: spring-cloud/authorization-server
    mem_limit: 512m
    networks:
      - my-network

  # $ mongosh
  mongodb:
    image: mongo:8.0
    mem_limit: 512m
    ports:
      - "27017:27017"
    command: mongod --wiredTigerCacheSizeGB 0.25
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - my-network

  # $ mysql -uroot -h127.0.0.1 -p
  mysql:
    image: mysql:8.4
    mem_limit: 512m
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpwd
      - MYSQL_DATABASE=review-db
      - MYSQL_USER=user
      - MYSQL_PASSWORD=pwd
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uuser", "-ppwd"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - my-network

  rabbitmq:
    image: rabbitmq:4-management
    mem_limit: 512m
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - my-network

  grafana-lgtm:
    image: grafana/otel-lgtm:0.37.0
    ports:
      - "3000:3000"   # Grafana 화면
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP (서비스가 보내는 곳)
    networks:
      - my-network

networks:
  my-network:
    name: my-network
