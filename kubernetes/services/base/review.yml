apiVersion: apps/v1
kind: Deployment
metadata:
  name: review
spec:
  replicas: 1
  selector:
    matchLabels:
      app: review
  template:
    metadata:
      labels:
        app: review
    spec:
      containers:
      - name: rev
        image: hands-on/review-service
        imagePullPolicy: Never
        env:
          - name: SPRING_PROFILES_ACTIVE
            value: "docker"
          # 프로필 적용 전에도 Config Server에 한 번 접속하므로, 주소는 프로필이 아니라 환경변수로 넘긴다 (docker-compose.yml과 동일)
          - name: APP_CONFIG_SERVER
            value: config-server
        envFrom:
          - secretRef:
              name: config-client-credentials
        ports:
        - containerPort: 80
        # 350Mi에서는 review(JPA/Hibernate)가 기동 중 OOMKilled되어 모든 서비스를 docker-compose.yml의 mem_limit(512m)과 맞춘다
        resources:
          limits:
            memory: 512Mi
        livenessProbe:
          httpGet:
            scheme: HTTP
            path: /actuator/health/liveness
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 20
          successThreshold: 1
        readinessProbe:
          httpGet:
            scheme: HTTP
            path: /actuator/health/readiness
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
          successThreshold: 1
---
apiVersion: v1
kind: Service
metadata:
  name: review
spec:
  selector:
    app: review
  ports:
    - port: 80
      targetPort: 80
