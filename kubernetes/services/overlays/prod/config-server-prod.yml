apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
spec:
  template:
    spec:
      containers:
      - name: config-server
        image: hands-on/config-server:v1
        # config-server는 config-repo에서 설정을 받지 않으므로 prod 프로필 대신 환경변수로 직접 조정한다
        env:
        - name: LOGGING_LEVEL_ROOT
          value: WARN
        - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
          value: "health,info"
        resources:
          requests:
            memory: 200Mi
          limits:
            memory: 512Mi
