# Eureka 서버의 HTTP Basic 인증 정보 (eureka-server의 app.eureka-username/password와 같아야 함)
app.eureka-username: u
app.eureka-password: p

server.port: 8443
spring.application.name: gateway

app.eureka-server: localhost

# OAuth2 리소스 서버: 인가 서버의 공개 키로 JWT 서명을 검증한다
app.auth-server: localhost
spring.security.oauth2.resourceserver.jwt.issuer-uri: https://dev-5r5apv33hgiui71h.us.auth0.com/

server.ssl:
  key-store-type: PKCS12
  key-store: classpath:keystore/edge.p12
  key-store-password: 89472643
  key-alias: localhost

eureka:
  client:
    serviceUrl:
      defaultZone: http://${app.eureka-username}:${app.eureka-password}@${app.eureka-server}:8761/eureka/
    initialInstanceInfoReplicationIntervalSeconds: 5
    registryFetchIntervalSeconds: 5
  instance:
    leaseRenewalIntervalInSeconds: 5
    leaseExpirationDurationInSeconds: 5

# 로드밸런서의 인스턴스 목록 캐시 (기본 35초 → 5초). 예전 ribbon.ServerListRefreshInterval 대체
spring.cloud.loadbalancer.cache.ttl: 5s

# 뒤쪽 서비스(특히 auth-server)에 원래 요청 주소(https://localhost:8443)를 X-Forwarded-* 헤더로 알려 준다
# 신뢰할 프록시를 지정하지 않으면 이 헤더를 붙이지 않으므로, 실습에서는 모두 신뢰한다 (운영에서는 실제 프록시 대역만)
spring.cloud.gateway.server.webflux.trusted-proxies: ".*"

spring.cloud.gateway.server.webflux.routes:

  - id: product-composite
    uri: lb://product-composite
    predicates:
      - Path=/product-composite/**

  # 인가 서버 (토큰 발급 /oauth2/token, 공개 키 /oauth2/jwks, 로그인 화면, OpenID 설정)
  - id: oauth2-server
    uri: lb://auth-server
    predicates:
      - Path=/oauth2/**

  - id: oauth2-login
    uri: lb://auth-server
    predicates:
      - Path=/login/**

  - id: oauth2-well-known
    uri: lb://auth-server
    predicates:
      - Path=/.well-known/**

  - id: eureka-api
    uri: http://${app.eureka-server}:8761
    predicates:
      - Path=/eureka/api/{segment}
    filters:
      - SetPath=/eureka/{segment}

  - id: eureka-web-start
    uri: http://${app.eureka-server}:8761
    predicates:
      - Path=/eureka/web
    filters:
      - SetPath=/

  - id: eureka-web-other
    uri: http://${app.eureka-server}:8761
    predicates:
      - Path=/eureka/**

  - id: host_route_200
    uri: https://httpbin.org
    predicates:
      - Host=i.feel.lucky:8443
      - Path=/headerrouting/**
    filters:
      - SetPath=/status/200

  - id: host_route_418
    uri: https://httpbin.org
    predicates:
      - Host=im.a.teapot:8443
      - Path=/headerrouting/**
    filters:
      - SetPath=/status/418

  - id: host_route_501
    uri: https://httpbin.org
    predicates:
      - Path=/headerrouting/**
    filters:
      - SetPath=/status/501

management.endpoint.health.show-details: "ALWAYS"
management.endpoints.web.exposure.include: "*"
management.endpoint.gateway.access: unrestricted

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator: INFO
    org.springframework.cloud.gateway: TRACE

---
spring.config.activate.on-profile: docker

app.eureka-server: eureka
app.auth-server: auth-server